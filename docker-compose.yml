services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mail_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-mail_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mail_gateway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mail_gateway} -d ${POSTGRES_DB:-mail_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn gateway.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: gateway.settings.production
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python manage.py send_queued_mail
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: gateway.settings.production
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  static_data:

services:
  db:
    image: postgres:16-alpine
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mail_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-mail_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mail_gateway}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mail_gateway} -d ${POSTGRES_DB:-mail_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    networks:
      - frontend
      - backend
    command: gunicorn gateway.wsgi:application --bind 0.0.0.0:8000 --workers 1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: gateway.settings.production
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
      EMAIL_GATEWAY_INLINE_WORKER_ENABLED: "true"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data/media:/app/media
      - ./data/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    networks:
      - backend
    command: python manage.py send_queued_mail
    profiles:
      - worker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: gateway.settings.production
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
      EMAIL_GATEWAY_INLINE_WORKER_ENABLED: "false"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    networks:
      - frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8184}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/app/media:ro
      - ./data/staticfiles:/app/staticfiles:ro
    depends_on:
      - web

networks:
  frontend:
  backend:
    internal: true
